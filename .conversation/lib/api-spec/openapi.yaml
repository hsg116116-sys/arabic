openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: platform
    description: Public platform data
  - name: student
    description: Student experience
  - name: teacher
    description: Teacher administration
  - name: auth
    description: Supabase-backed authentication
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /platform/overview:
    get:
      operationId: getPlatformOverview
      tags: [platform]
      summary: Get public platform overview
      responses:
        "200":
          description: Platform overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOverview"
  /student/dashboard:
    get:
      operationId: getStudentDashboard
      tags: [student]
      summary: Get the current student's dashboard
      responses:
        "200":
          description: Student dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboard"
  /teacher/dashboard:
    get:
      operationId: getTeacherDashboard
      tags: [teacher]
      summary: Get teacher dashboard metrics
      responses:
        "200":
          description: Teacher dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherDashboard"
  /courses:
    get:
      operationId: listCourses
      tags: [platform]
      summary: List learning units
      responses:
        "200":
          description: Learning units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
  /assignments:
    get:
      operationId: listAssignments
      tags: [student, teacher]
      summary: List assignments
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
  /assessments:
    get:
      operationId: listAssessments
      tags: [student, teacher]
      summary: List assessments
      responses:
        "200":
          description: Assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [student, teacher]
      summary: List announcements
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
  /teacher/settings:
    get:
      operationId: getTeacherSettings
      tags: [teacher]
      summary: Get editable platform settings
      responses:
        "200":
          description: Platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
    patch:
      operationId: updateTeacherSettings
      tags: [teacher]
      summary: Update platform settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
  /teacher/students:
    get:
      operationId: listStudents
      tags: [teacher]
      summary: List students for the teacher
      responses:
        "200":
          description: Students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create a student account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterInput"
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid account data
  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthEmailInput"
      responses:
        "200":
          description: Reset email requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
  /auth/google:
    get:
      operationId: getGoogleAuthUrl
      tags: [auth]
      summary: Get the Supabase Google OAuth URL
      responses:
        "200":
          description: Google OAuth URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOAuthResponse"
  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: Sign out the current session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PlatformOverview:
      type: object
      required: [platformName, teacherName, tagline, description, stats, settings]
      properties:
        platformName: { type: string }
        teacherName: { type: string }
        tagline: { type: string }
        description: { type: string }
        stats:
          $ref: "#/components/schemas/PlatformStats"
        settings:
          $ref: "#/components/schemas/PlatformSettings"
    PlatformStats:
      type: object
      required: [students, units, assessments, assignments, certificates]
      properties:
        students: { type: integer }
        units: { type: integer }
        assessments: { type: integer }
        assignments: { type: integer }
        certificates: { type: integer }
    PlatformSettings:
      type: object
      required: [platformName, teacherName, teacherBio, teacherImageUrl, signatureUrl, accentColor]
      properties:
        platformName: { type: string }
        teacherName: { type: string }
        teacherBio: { type: string }
        teacherImageUrl: { type: string }
        signatureUrl: { type: string }
        accentColor: { type: string }
    PlatformSettingsUpdate:
      type: object
      properties:
        platformName: { type: string }
        teacherName: { type: string }
        teacherBio: { type: string }
        teacherImageUrl: { type: string }
        signatureUrl: { type: string }
        accentColor: { type: string }
    StudentDashboard:
      type: object
      required: [student, progress, completedLessons, nextUp, announcements]
      properties:
        student:
          $ref: "#/components/schemas/Student"
        progress: { type: integer }
        completedLessons: { type: integer }
        nextUp:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        announcements:
          type: array
          items:
            $ref: "#/components/schemas/Announcement"
    TeacherDashboard:
      type: object
      required: [stats, weeklyActivity, recentStudents, pendingAssignments]
      properties:
        stats:
          $ref: "#/components/schemas/TeacherStats"
        weeklyActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityPoint"
        recentStudents:
          type: array
          items:
            $ref: "#/components/schemas/Student"
        pendingAssignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
    TeacherStats:
      type: object
      required: [students, activeStudents, schools, units, assignments, assessments, averageScore, certificates]
      properties:
        students: { type: integer }
        activeStudents: { type: integer }
        schools: { type: integer }
        units: { type: integer }
        assignments: { type: integer }
        assessments: { type: integer }
        averageScore: { type: integer }
        certificates: { type: integer }
    ActivityPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: integer }
    Student:
      type: object
      required: [id, name, email, school, branch, grade, section, gender, progress, status, avatarUrl]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        school: { type: string }
        branch: { type: string }
        grade: { type: string }
        section: { type: string }
        gender: { type: string }
        progress: { type: integer }
        status: { type: string }
        avatarUrl: { type: string }
    Course:
      type: object
      required: [id, title, description, lessons, duration, progress, color, icon]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        lessons: { type: integer }
        duration: { type: string }
        progress: { type: integer }
        color: { type: string }
        icon: { type: string }
    Assignment:
      type: object
      required: [id, title, description, unit, dueDate, status, points]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        unit: { type: string }
        dueDate: { type: string }
        status: { type: string }
        points: { type: integer }
    Assessment:
      type: object
      required: [id, title, questions, duration, score, status, date]
      properties:
        id: { type: string }
        title: { type: string }
        questions: { type: integer }
        duration: { type: string }
        score: { type: integer }
        status: { type: string }
        date: { type: string }
    Announcement:
      type: object
      required: [id, title, body, date, type, audience]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        date: { type: string }
        type: { type: string }
        audience: { type: string }
    AuthRegisterInput:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        fullName: { type: string, minLength: 2 }
        studentNumber: { type: string }
        school: { type: string }
        branch: { type: string }
        grade: { type: string }
        section: { type: string }
        gender: { type: string }
        phone: { type: string }
    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
    AuthEmailInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    AuthUser:
      type: object
      required: [id, email, fullName]
      properties:
        id: { type: string }
        email: { type: string }
        fullName: { type: string }
    AuthResponse:
      type: object
      required: [message, user]
      properties:
        message: { type: string }
        user:
          $ref: "#/components/schemas/AuthUser"
    AuthMessage:
      type: object
      required: [message]
      properties:
        message: { type: string }
    AuthOAuthResponse:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }

